name: Cloud Video Renderer

on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch:

jobs:
  build_video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Fonts, and Kokoro-82M Voice Engine
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-ebgaramond fonts-noto-core libsndfile1 wget curl
          pip install requests cloudinary kokoro-onnx soundfile numpy fonttools edge-tts gTTS
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx -O kokoro-v1.0.int8.onnx
          wget -q https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -O voices-v1.0.bin
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/crimsontext/CrimsonText-Italic.ttf" -o PoetryItalic.ttf || true

      - name: Run Mode 1 Multi-Scene Video Renderer & Dispatch to Make.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: python render_cloud.py
